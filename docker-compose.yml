version: '3.8'

services: # abre a lista dos containers q serão criados
  # --- BANCO DE DADOS ---
  db:
    image: postgres:15-alpine
    container_name: saei_postgres
    environment:
      POSTGRES_USER: saei_user
      POSTGRES_PASSWORD: saei_password
      POSTGRES_DB: saei_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # O Postgres salva todos os arquivos binários das tabelas nessa pasta interna. Sem essa linha, no momento em que o Docker fosse desligado, todos os usuários, cadastros e dados criados sumiriam.
    networks:
      - saei_network

  # --- BACKEND (FASTAPI) ---
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: saei_backend
    ports:
      - "8000:8000" # Acesse a API em http://localhost:8000
    environment:
      # O host aqui é 'db' (o nome do serviço acima), NÃO é localhost!
      DATABASE_URL: postgresql://saei_user:saei_password@db:5432/saei_db
      SECRET_KEY: dcvEek8zldAUpcB3OT9h3nczSpB3nq35v7WMXtUSgOB
    volumes:
      # Espelha a pasta local para o container (Hot-Reload em tempo real)
      - ./backend:/app
    depends_on:
      - db # serviço backend depende q o serviço db esteja ligado primeiro
    networks:
      - saei_network

volumes:
  postgres_data:

networks:
  saei_network:
    driver: bridge
