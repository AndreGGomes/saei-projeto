version: '3.8'

services:
  # --- BANCO DE DADOS ---
  db:
    image: postgres:15-alpine
    container_name: saei_postgres
    environment:
      POSTGRES_USER: saei_user
      POSTGRES_PASSWORD: saei_password
      POSTGRES_DB: saei_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saei_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saei_user -d saei_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- BACKEND (FASTAPI) ---
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: saei_backend
    ports:
      - "8000:8000" # Acesse a API em http://localhost:8000
    environment:
      DATABASE_URL: postgresql://saei_user:saei_password@db:5432/saei_db
      SECRET_KEY: dcvEek8zldAUpcB3OT9h3nczSpB3nq35v7WMXtUSgOB
      GEMINI_API_KEY: AQ.Ab8RN6LHzdcwG6t5F8NLxbJRjESqQ5L5OSBikBuE4-Om5SXqfA
      GROQ_API_KEY: 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
      GROQ_API_KEY_B: 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
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - saei_network

  # --- FRONTEND (REACT + VITE) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saei_frontend
    ports:
      - "5173:5173" # Acesse o React em http://localhost:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules # Impede que a máquina hospedeira sobrescreva os binários do container
    depends_on:
      - backend
    networks:
      - saei_network

volumes:
  postgres_data:
  backend_uploads:

networks:
  saei_network:
    driver: bridge