version: '3.8'

services:
  # --- BANCO DE DADOS ---
  db:
    image: postgres:15-alpine
    container_name: saei_postgres
    environment:
      POSTGRES_USER: saei_user
      POSTGRES_PASSWORD: saei_password
      POSTGRES_DB: saei_db
    ports:
      - "5432:5432" # Mapeado para você usar o DBeaver no seu PC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saei_network

  # --- BACKEND (FASTAPI) ---
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: saei_backend
    ports:
      - "8000:8000" # Acesse a API em http://localhost:8000
    environment:
      # O host aqui é 'db' (o nome do serviço acima), NÃO é localhost!
      DATABASE_URL: postgresql://saei_user:saei_password@db:5432/saei_db
    volumes:
      # Espelha a pasta local para o container (Hot-Reload em tempo real)
      - ./backend:/app
    depends_on:
      - db
    networks:
      - saei_network

volumes:
  postgres_data:

networks:
  saei_network:
    driver: bridge